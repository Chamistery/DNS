# <имя> [ttl] <тип> <значение>
# Имя без точки на конце дополняется $ORIGIN, @ — сам $ORIGIN.

$TTL 300

example.com          A      93.184.216.34
www.example.com      A      93.184.216.34
myservice.test       A      127.0.0.1
myservice.test       A      127.0.0.2
*.dev.test           A      10.0.0.5

$ORIGIN lab.test.
@          SOA    ns1 hostmaster 2026101901 3600 600 86400 300
@          NS     ns1
@          NS     ns2
ns1        A      10.1.0.1
ns2        A      10.1.0.2
@          A      10.1.0.10
@          AAAA   2001:db8::10
www        CNAME  @
mail       A      10.1.0.20
@          MX     10 mail
@          MX     20 mail2.example.net.
@          TXT    "v=spf1 mx -all"
@          TXT    "hello" "world"
_sip._tcp  SRV    10 60 5060 sip
sip        A      10.1.0.30
@          CAA    0 issue "letsencrypt.org"
host       HINFO  "ARM64" "macOS"
alias      CNAME  www
ext        CNAME  example.com.
10.0.0.10.in-addr.arpa.  PTR  lab.test.
